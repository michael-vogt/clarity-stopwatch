<div class="grid-row clickable">
  <div class="grid-cell clickable" (click)="goToStopwatch(task())">
    <span>{{ task().bezeichnung }}</span>
    <span>{{ task().id }}</span>
  </div>
  @for (day of daysOfWeek(); track day; let i = $index) {
    <div class="grid-cell clickable" [class.today-column]="todayIndex() === i" (click)="goToStopwatch(task(), day)">{{ effort(day) | elapsedTime: { format: format(), shortForZeros: true, zeroReplacement: '-' } }}</div>
  }
  <div class="grid-cell total-column">{{ effortOfWeek() | elapsedTime: { format: format(), shortForZeros: true, zeroReplacement: '-'} }}</div>
</div>
